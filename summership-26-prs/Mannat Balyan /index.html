<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Python Tip of the Day</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="tip-card">

            <div class="header">
                <div class="icon">💡</div>

                <div>
                    <h1>Python Tip of the Day</h1>
                    <p>Learn something new every day.</p>
                </div>
            </div>

            <div class="tip-content">

                <span class="label">PYTHON TIP</span>

                <h2 id="tip-title">Use enumerate()</h2>

                <p id="tip-text">
                    Use enumerate() when you need both the index and
                    value while looping through a list.
                </p>

                <pre><code id="tip-code"></code></pre>

                <button id="next-tip">
                    🔄 Next Tip
                </button>

            </div>

            <div class="tip-counter">
                Tip <span id="tip-number">1</span> of 20
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
