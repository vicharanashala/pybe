version: '3.8'

services:
  # Backend Flask API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: pybe-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - STORAGE_MODE=sqlite
      - JWT_SECRET=pybe-docker-secret-key-change-in-production
      - CORS_ORIGINS=http://localhost:5173
      - PYBE_PORT=5000
    volumes:
      - ./server:/app
      - pybe-data:/app/instance
    networks:
      - pybe-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend Vite Dev Server
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: pybe-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    volumes:
      - ./client:/app
      - /app/node_modules
    networks:
      - pybe-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # MongoDB (optional - for production)
  mongodb:
    image: mongo:7
    container_name: pybe-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=pybe
    volumes:
      - pybe-mongo-data:/data/db
    networks:
      - pybe-network
    profiles:
      - with-mongodb

  # Redis (for rate limiting - future use)
  redis:
    image: redis:7-alpine
    container_name: pybe-redis
    ports:
      - "6379:6379"
    volumes:
      - pybe-redis-data:/data
    networks:
      - pybe-network
    profiles:
      - with-redis

networks:
  pybe-network:
    driver: bridge

volumes:
  pybe-data:
  pybe-mongo-data:
  pybe-redis-data: